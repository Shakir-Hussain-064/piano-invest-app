name: 24/7 Render Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend at $(date)"
          curl -s -f "https://piano-invest-app.onrender.com/health" || curl -s "https://piano-invest-app.onrender.com/health" || echo "Ping attempted"
