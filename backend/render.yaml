services:
  - type: web
    name: piano-invest-app
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPI_ID
        value: 79062276slic.slc
      - key: BRAND_NAME
        value: Solar Wealth
      - key: CLIENT_URL
        value: "*"
